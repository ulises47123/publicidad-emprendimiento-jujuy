<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Video promo</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="piezas.css">
<style>
  /* ---- Video vertical 1080x1920. Zona segura de Reels/Estados: ~250 px arriba y ~380 abajo ---- */
  .video .esc { position: absolute; inset: 0; will-change: opacity, transform; }
  .video .esc > * { position: absolute; }
  .video .cab { top: 262px; z-index: 3; }
  .video .banda { height: 330px; z-index: 0; }
  .v-centro { left: 80px; right: 80px; text-align: center; display: grid; justify-items: center; }
  .v-etq { left: 0; right: 0; top: 352px; display: flex; justify-content: center; }
  .v-tit { left: 70px; right: 70px; top: 450px; text-align: center; font-size: 112px; }

  /* escena 0: gancho */
  .e0-ante { top: 670px; font-size: 54px; }
  .e0-tit { left: 60px; right: 60px; top: 760px; text-align: center; font-size: 172px; }
  .e0-aguayo { left: 50%; top: 1230px; width: 420px; margin-left: -210px; }

  /* escena de servicio: video */
  .e1-vid { left: 0; right: 0; top: 700px; display: flex; justify-content: center; }
  .e1-det { top: 1440px; font-size: 40px; color: var(--texto-suave); }

  /* escena de servicio: invitaciones */
  .e2-tel { left: 104px; top: 740px; }
  .e2-chips { left: 560px; right: 70px; top: 840px; }
  .e2-chips .chips { flex-direction: column; align-items: flex-start; gap: 22px; }
  .e2-chips .chip { font-size: 40px; padding: 16px 32px; }

  /* escena final: cierre */
  .e4-tit { left: 70px; right: 70px; top: 400px; text-align: center; font-size: 150px; }
  .e4-cta { left: 76px; right: 76px; top: 800px; display: grid; justify-items: center; gap: 30px; }
  .e4-cta .boton { font-size: 44px; padding: 30px 46px; }
  .e4-num { font-family: "Gloock", serif; font-size: 124px; line-height: 1; white-space: nowrap; text-align: center; }
  .e4-num span { display: block; font-family: "Outfit", sans-serif; font-weight: 700; font-size: 34px; letter-spacing: .16em; text-transform: uppercase; color: var(--oro); margin-bottom: 14px; }
  .e4-lugar { font-size: 36px; color: var(--texto-suave); }
  .e4-serv { left: 76px; right: 76px; top: 1300px; display: flex; justify-content: center; gap: 26px; }
  .e4-serv .ico { width: 92px; height: 92px; border-radius: 26px; }
  .e4-serv .ico svg { width: 50px; height: 50px; }
  .e4-serv .ico:nth-child(2) { background: var(--acento); }
  .e4-serv .ico:nth-child(3) { background: var(--cerro-4); }
  .e4-serv .ico:nth-child(4) { background: var(--cerro-5); }

  /* ---- Animaciones (el tiempo lo maneja seek(t); delay = inicio de escena + data-in) ---- */
  [data-anim] { animation-fill-mode: both; animation-play-state: paused; }
  [data-anim="sube"]   { animation-name: sube;   animation-duration: .7s; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  [data-anim="aparece"]{ animation-name: aparece; animation-duration: .6s; animation-timing-function: ease-out; }
  [data-anim="escala"] { animation-name: escala; animation-duration: .8s; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  [data-anim="pop"]    { animation-name: pop;    animation-duration: .55s; animation-timing-function: cubic-bezier(.3,1.5,.5,1); }
  [data-anim="banda"]  { animation-name: banda;  animation-duration: 1.2s; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  [data-anim="izq"]    { animation-name: izq;    animation-duration: .6s; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  [data-anim="pulso"]  { animation-name: pulso;  animation-duration: 1.1s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
  .video .vid-cabezal  { animation: cabezal 2.6s linear both paused; }
  .video .vid-pista .clip { animation: clip .45s cubic-bezier(.2,.8,.2,1) both paused; transform-origin: left center; }
  .video .tel .anim-a, .video .tel .anim-b, .video .tel .anim-c, .video .tel .anim-d, .video .tel .anim-e { animation: sube .55s cubic-bezier(.2,.8,.2,1) both paused; }

  @keyframes sube    { from { opacity: 0; transform: translateY(44px); } to { opacity: 1; transform: none; } }
  @keyframes aparece { from { opacity: 0; } to { opacity: 1; } }
  @keyframes escala  { from { opacity: 0; transform: scale(.86) translateY(30px); } to { opacity: 1; transform: none; } }
  @keyframes pop     { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
  @keyframes izq     { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: none; } }
  @keyframes banda   { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes pulso   { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.045); } }
  @keyframes cabezal { from { left: 4%; } to { left: 92%; } }
  @keyframes clip    { from { transform: scaleX(0); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<div id="raiz"></div>
<script>if (!window.CFG) document.write('<script src="../config_vista_previa.js"><\/script>');</script>
<script src="componentes.js"></script>
<script src="video.js"></script>
</body>
</html>
